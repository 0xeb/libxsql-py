name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run mypy src/libxsql examples scripts
      - run: uv run codespell .
      - run: uv run mkdocs build --strict
      - run: uv run pip-audit
      - name: Verify version consistency
        run: >-
          uv run python -c "import ast,pathlib,tomllib;
          root=pathlib.Path('.');
          project=tomllib.loads((root/'pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          tree=ast.parse((root/'src/libxsql/__init__.py').read_text(encoding='utf-8'));
          fallbacks=[node.value.value for node in ast.walk(tree)
          if isinstance(node,ast.Assign) and isinstance(node.value,ast.Constant)
          and any(isinstance(target,ast.Name) and target.id=='__version__' for target in node.targets)];
          assert fallbacks==[project],(fallbacks,project)"

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: uv run check-wheel-contents dist/*.whl
      - run: uv run python scripts/verify_artifacts.py
      - shell: bash
        run: |
          python -m venv build/smoke
          build/smoke/bin/python -c "import pathlib, subprocess, sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', f'{wheel}[all]'])"
          build/smoke/bin/python -m pip check
          build/smoke/bin/python -c "import libxsql; assert libxsql.__version__, libxsql.__version__; print(libxsql.__version__)"
          build/smoke/bin/python -m libxsql version
          build/smoke/bin/python -m libxsql query "SELECT 40 + 2 AS answer"
          build/smoke/bin/python examples/basic.py
          build/smoke/bin/python examples/async_basic.py
        if: runner.os != 'Windows'
      - shell: pwsh
        run: |
          python -m venv build/smoke
          build/smoke/Scripts/python -c "import pathlib, subprocess, sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', f'{wheel}[all]'])"
          build/smoke/Scripts/python -m pip check
          build/smoke/Scripts/python -c "import libxsql; assert libxsql.__version__, libxsql.__version__; print(libxsql.__version__)"
          build/smoke/Scripts/python -m libxsql version
          build/smoke/Scripts/python -m libxsql query "SELECT 40 + 2 AS answer"
          build/smoke/Scripts/python examples/basic.py
          build/smoke/Scripts/python examples/async_basic.py
        if: runner.os == 'Windows'

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv venv build/minimum --python 3.11
      - name: Install declared lower bounds
        run: >-
          uv pip install --python build/minimum/bin/python
          ".[all]"
          "anyio==4.11.0"
          "apsw==3.53.3.1"
          "httpx==0.28.0"
          "hypercorn==0.17.0"
          "trio==0.30.0"
          "pyperclip==1.9.0"
      - run: uv pip check --python build/minimum/bin/python
      - run: >-
          uv run pip-audit
          --path build/minimum/lib/python3.11/site-packages
          --progress-spinner off
      - run: >-
          build/minimum/bin/python -c
          "import libxsql; connection=libxsql.connect();
          assert libxsql.__version__;
          assert connection.scalar('SELECT 40 + 2') == 42; connection.close()"
      - run: build/minimum/bin/python examples/basic.py
      - run: build/minimum/bin/python examples/async_basic.py
